<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI语音助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .main-container {
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            box-shadow: 0 25px 80px rgba(255, 154, 158, 0.4);
            display: flex;
            overflow: hidden;
        }

        .left-panel {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 240, 245, 0.9) 100%);
            border-right: 2px solid rgba(255, 182, 193, 0.3);
        }

        .right-panel {
            flex: 1.2;
            padding: 30px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.7);
        }

        .avatar-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin-bottom: 40px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 15px 40px rgba(255, 154, 158, 0.5);
            animation: float 3s ease-in-out infinite;
        }

        .avatar-face {
            width: 140px;
            height: 140px;
            background: #fff5f5;
            border-radius: 50%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .avatar-eyes {
            display: flex;
            gap: 30px;
            margin-bottom: 15px;
        }

        .avatar-eye {
            width: 20px;
            height: 20px;
            background: #4a4a4a;
            border-radius: 50%;
            position: relative;
        }

        .avatar-eye::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            top: 3px;
            right: 3px;
        }

        .avatar-mouth {
            width: 30px;
            height: 15px;
            background: #ff6b6b;
            border-radius: 0 0 30px 30px;
            transition: all 0.3s ease;
        }

        .avatar-mouth.speaking {
            animation: speak 0.3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes speak {
            0%, 100% { height: 15px; }
            50% { height: 25px; }
        }

        .assistant-name {
            font-size: 28px;
            font-weight: bold;
            color: #ff6b6b;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(255, 107, 107, 0.2);
        }

        .status-display {
            background: linear-gradient(135deg, #fff5f5 0%, #ffe4e4 100%);
            border-radius: 25px;
            padding: 25px 35px;
            margin-bottom: 40px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 182, 193, 0.5);
            width: 100%;
            max-width: 350px;
        }

        .status-display.active {
            border-color: #ff6b6b;
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.3);
        }

        .status-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .status-text {
            font-size: 16px;
            color: #666;
            font-weight: 500;
        }

        .status-display.thinking .status-icon {
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }

        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .record-button {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.5);
            transition: all 0.3s ease;
            position: relative;
        }

        .record-button::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: inherit;
            z-index: -1;
            animation: ripple 2s ease-out infinite;
        }

        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.5; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .record-button:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(255, 107, 107, 0.6);
        }

        .record-button:active {
            transform: scale(0.95);
        }

        .record-button.recording {
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            animation: recording-pulse 1s ease-in-out infinite;
        }

        @keyframes recording-pulse {
            0%, 100% { box-shadow: 0 8px 25px rgba(255, 71, 87, 0.5); }
            50% { box-shadow: 0 8px 45px rgba(255, 71, 87, 0.8); }
        }

        .record-button svg {
            width: 35px;
            height: 35px;
            fill: white;
        }

        .record-button.recording svg {
            width: 25px;
            height: 25px;
            border-radius: 4px;
        }

        .button-label {
            font-size: 16px;
            color: #ff6b6b;
            font-weight: 600;
            margin-top: 10px;
        }

        .conversation-header {
            font-size: 24px;
            font-weight: bold;
            color: #ff6b6b;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid rgba(255, 182, 193, 0.5);
        }

        .conversation-history {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .conversation-history::-webkit-scrollbar {
            width: 8px;
        }

        .conversation-history::-webkit-scrollbar-track {
            background: rgba(255, 182, 193, 0.2);
            border-radius: 10px;
        }

        .conversation-history::-webkit-scrollbar-thumb {
            background: rgba(255, 107, 107, 0.5);
            border-radius: 10px;
        }

        .message {
            padding: 15px 20px;
            border-radius: 20px;
            max-width: 80%;
            word-wrap: break-word;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #ff6b6b 0%, #ff8e8e 100%);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .message.ai {
            align-self: flex-start;
            background: linear-gradient(135deg, #fff5f5 0%, #ffe4e4 100%);
            color: #333;
            border-bottom-left-radius: 5px;
            border: 2px solid rgba(255, 182, 193, 0.5);
        }

        .message-time {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 5px;
        }

        .message.user .message-time {
            color: rgba(255, 255, 255, 0.8);
        }

        .message.ai .message-time {
            color: rgba(0, 0, 0, 0.5);
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #ffb3b3;
            font-size: 16px;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 900px) {
            .main-container {
                flex-direction: column;
                height: auto;
                max-height: 95vh;
                overflow-y: auto;
            }

            .left-panel {
                border-right: none;
                border-bottom: 2px solid rgba(255, 182, 193, 0.3);
                padding: 30px 20px;
            }

            .right-panel {
                min-height: 400px;
            }

            .avatar-container {
                width: 150px;
                height: 150px;
                margin-bottom: 20px;
            }

            .avatar-face {
                width: 100px;
                height: 100px;
            }

            .record-button {
                width: 70px;
                height: 70px;
            }

            .record-button svg {
                width: 28px;
                height: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="left-panel">
            <div class="avatar-container">
                <div class="avatar">
                    <div class="avatar-face">
                        <div class="avatar-eyes">
                            <div class="avatar-eye"></div>
                            <div class="avatar-eye"></div>
                        </div>
                        <div class="avatar-mouth" id="avatarMouth"></div>
                    </div>
                </div>
            </div>
            
            <div class="assistant-name">AI 小助手</div>
            
            <div class="status-display" id="statusDisplay">
                <div class="status-icon" id="statusIcon">👋</div>
                <div class="status-text" id="statusText">你好！点击按钮开始对话</div>
            </div>
            
            <div class="controls">
                <button class="record-button" id="recordButton">
                    <svg id="micIcon" viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                </button>
                <div class="button-label" id="buttonLabel">点击开始录音</div>
            </div>
        </div>
        
        <div class="right-panel">
            <div class="conversation-header">💬 对话记录</div>
            <div class="conversation-history" id="conversationHistory">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H6l-2 2V4h16v12z"/>
                    </svg>
                    <div>还没有对话记录</div>
                    <div style="font-size: 14px; margin-top: 10px;">点击左侧按钮开始与 AI 交流吧！</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws = null;
        let isRecording = false;
        let audioContext = null;
        let scriptProcessor = null;
        let mediaStream = null;
        let audioChunks = [];
        let conversationStarted = false;
        let reconnectTimeout = null;

        const recordButton = document.getElementById('recordButton');
        const micIcon = document.getElementById('micIcon');
        const buttonLabel = document.getElementById('buttonLabel');
        const statusDisplay = document.getElementById('statusDisplay');
        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');
        const conversationHistory = document.getElementById('conversationHistory');
        const avatarMouth = document.getElementById('avatarMouth');

        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            
            ws.onopen = () => {
                console.log('WebSocket connected');
                updateStatus('connected', '🔗', '已连接到服务器');
                ws.send(JSON.stringify({
                    type: 'connect',
                    client_id: 'web_client',
                    room_id: 'web_room'
                }));
            };
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleMessage(data);
            };
            
            ws.onclose = () => {
                console.log('WebSocket disconnected');
                updateStatus('disconnected', '❌', '连接已断开');
                if (reconnectTimeout) clearTimeout(reconnectTimeout);
                reconnectTimeout = setTimeout(connectWebSocket, 3000);
            };
            
            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
                updateStatus('error', '⚠️', '连接错误');
            };
        }

        let audioQueue = [];
        let isPlaying = false;
        let currentSource = null;

        function handleMessage(data) {
            switch(data.type) {
                case 'status':
                    handleStatusUpdate(data);
                    break;
                case 'user_text':
                    handleTranscription(data);
                    break;
                case 'ai_text':
                    handleAIResponse(data);
                    break;
                case 'ai_text_chunk':
                    handleAITextChunk(data);
                    break;
                case 'audio_response':
                    handleAudio(data);
                    break;
                case 'audio_chunk':
                    handleAudioChunk(data);
                    break;
                case 'error':
                    handleError(data);
                    break;
            }
        }

        function handleStatusUpdate(data) {
            switch(data.status) {
                case 'recording':
                    updateStatus('recording', '🎤', '正在录音...');
                    break;
                case 'processing':
                    updateStatus('thinking', '🤔', '正在识别语音...');
                    break;
                case 'generating':
                    updateStatus('thinking', '💭', 'AI 正在思考...');
                    break;
                case 'synthesizing':
                    updateStatus('thinking', '🎵', '正在生成语音...');
                    break;
                case 'playing':
                    updateStatus('playing', '🔊', '正在播放...');
                    avatarMouth.classList.add('speaking');
                    break;
                case 'stopped':
                    updateStatus('idle', '👋', '你好！点击按钮开始对话');
                    break;
            }
        }

        function handleTranscription(data) {
            if (data.text && data.text.trim()) {
                addMessage('user', data.text);
            }
        }

        let currentAIMessage = null;
        let currentAIMessageId = null;

        function handleAITextChunk(data) {
            if (data.text && data.text.trim()) {
                if (!conversationStarted) {
                    conversationStarted = true;
                    conversationHistory.innerHTML = '';
                }

                if (!currentAIMessage) {
                    // 创建新的AI消息
                    currentAIMessage = document.createElement('div');
                    currentAIMessage.className = 'message ai';
                    
                    const now = new Date();
                    const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
                    
                    currentAIMessage.innerHTML = `
                        <div id="ai-message-${Date.now()}">${escapeHtml(data.text)}</div>
                        <div class="message-time">${timeStr}</div>
                    `;
                    
                    currentAIMessageId = currentAIMessage.querySelector('div').id;
                    conversationHistory.appendChild(currentAIMessage);
                } else {
                    // 更新现有消息
                    const messageElement = document.getElementById(currentAIMessageId);
                    if (messageElement) {
                        messageElement.textContent += data.text;
                    }
                }
                
                conversationHistory.scrollTop = conversationHistory.scrollHeight;
            }
        }

        function handleAIResponse(data) {
            // 清除当前正在构建的消息引用
            currentAIMessage = null;
            currentAIMessageId = null;
            
            if (data.text && data.text.trim()) {
                // 获取情绪信息
                const emotion = data.emotion || 'neutral';
                console.log('AI response emotion:', emotion);
                
                // 如果需要，也可以更新最终消息
                const messages = conversationHistory.querySelectorAll('.message.ai');
                if (messages.length > 0) {
                    const lastMessage = messages[messages.length - 1];
                    const messageContent = lastMessage.querySelector('div');
                    if (messageContent) {
                        messageContent.textContent = data.text;
                    }
                } else {
                    addMessage('ai', data.text);
                }
            }
        }

        function handleAudioChunk(data) {
            if (data.audio_data) {
                console.log('Received audio_chunk message');
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    console.log('Created audio context');
                }
                
                try {
                    // 将音频块添加到队列
                    const audioData = atob(data.audio_data);
                    console.log('Decoded base64, size:', audioData.length);
                    
                    const arrayBuffer = new ArrayBuffer(audioData.length);
                    const view = new Uint8Array(arrayBuffer);
                    
                    for (let i = 0; i < audioData.length; i++) {
                        view[i] = audioData.charCodeAt(i);
                    }
                    
                    console.log('Created ArrayBuffer, size:', arrayBuffer.byteLength);
                    
                    // 检查WAV文件头
                    const headerView = new DataView(arrayBuffer);
                    const riffId = String.fromCharCode(
                        headerView.getUint8(0),
                        headerView.getUint8(1),
                        headerView.getUint8(2),
                        headerView.getUint8(3)
                    );
                    const waveId = String.fromCharCode(
                        headerView.getUint8(8),
                        headerView.getUint8(9),
                        headerView.getUint8(10),
                        headerView.getUint8(11)
                    );
                    console.log('WAV header:', riffId, waveId);
                    
                    audioQueue.push(arrayBuffer);
                    console.log('Added to queue, queue size:', audioQueue.length);
                    
                    // 如果当前没有播放，开始播放
                    if (!isPlaying) {
                        console.log('Starting playback from queue');
                        playAudioFromQueue();
                    }
                } catch (error) {
                    console.error('Error processing audio chunk:', error);
                }
            }
        }

        function handleAudio(data) {
            if (data.audio_data) {
                // 处理非流式音频响应
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                const audioData = atob(data.audio_data);
                const arrayBuffer = new ArrayBuffer(audioData.length);
                const view = new Uint8Array(arrayBuffer);
                
                for (let i = 0; i < audioData.length; i++) {
                    view[i] = audioData.charCodeAt(i);
                }
                
                // 获取情绪信息
                const emotion = data.emotion || 'neutral';
                console.log('Audio response emotion:', emotion);
                
                audioContext.decodeAudioData(arrayBuffer, (buffer) => {
                    const source = audioContext.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioContext.destination);
                    source.onended = () => {
                        avatarMouth.classList.remove('speaking');
                        updateStatus('idle', '👋', '你好！点击按钮开始对话');
                    };
                    source.start(0);
                    
                    updateStatus('playing', '🔊', `正在播放... (情绪: ${emotion})`);
                    avatarMouth.classList.add('speaking');
                }, (error) => {
                    console.error('Audio decode error:', error);
                    updateStatus('error', '⚠️', '音频播放失败');
                });
            }
        }

        function handleError(data) {
            console.error('Server error:', data.message);
            updateStatus('error', '⚠️', data.message || '发生错误');
        }

        function updateStatus(state, icon, text) {
            statusDisplay.classList.remove('active', 'thinking');
            statusIcon.textContent = icon;
            statusText.textContent = text;
            
            if (state === 'recording' || state === 'thinking' || state === 'playing') {
                statusDisplay.classList.add('active');
            }
            
            if (state === 'thinking') {
                statusDisplay.classList.add('thinking');
            }
        }

        function addMessage(sender, text, emotion = null) {
            if (!conversationStarted) {
                conversationStarted = true;
                conversationHistory.innerHTML = '';
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            let messageHTML = `
                <div>${escapeHtml(text)}</div>
                <div class="message-time">${timeStr}</div>
            `;
            
            messageDiv.innerHTML = messageHTML;
            
            conversationHistory.appendChild(messageDiv);
            conversationHistory.scrollTop = conversationHistory.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function playAudioFromQueue() {
            if (audioQueue.length === 0) {
                isPlaying = false;
                // 检查是否还有更多音频块会到来
                // 如果在一段时间内没有新的音频块，重置状态
                setTimeout(() => {
                    if (audioQueue.length === 0) {
                        avatarMouth.classList.remove('speaking');
                        updateStatus('idle', '👋', '你好！点击按钮开始对话');
                    }
                }, 500);
                return;
            }
            
            isPlaying = true;
            updateStatus('playing', '🔊', '正在播放...');
            avatarMouth.classList.add('speaking');
            
            // 获取队列中的第一个音频块
            const arrayBuffer = audioQueue.shift();
            
            try {
                console.log('Received audio chunk, size:', arrayBuffer.byteLength);
                
                // 解码音频数据
                const buffer = await audioContext.decodeAudioData(arrayBuffer);
                
                // 创建音频源
                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                
                // 播放完成后播放下一个音频块
                source.onended = () => {
                    // 如果有正在播放的音频，先停止
                    if (currentSource && currentSource !== source) {
                        try {
                            currentSource.stop();
                        } catch (e) {
                            // 忽略已经停止的错误
                        }
                    }
                    
                    currentSource = null;
                    // 继续播放队列中的下一个音频块
                    playAudioFromQueue();
                };
                
                // 播放音频
                currentSource = source;
                source.start(0);
                console.log('Playing audio chunk, duration:', buffer.duration);
            } catch (error) {
                console.error('Audio decode error:', error);
                // 继续尝试播放下一个音频块
                playAudioFromQueue();
            }
        }

        function playAudio(base64Audio) {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                
                const audioData = atob(base64Audio);
                const arrayBuffer = new ArrayBuffer(audioData.length);
                const view = new Uint8Array(arrayBuffer);
                
                for (let i = 0; i < audioData.length; i++) {
                    view[i] = audioData.charCodeAt(i);
                }
                
                audioContext.decodeAudioData(arrayBuffer, (buffer) => {
                    const source = audioContext.createBufferSource();
                    source.buffer = buffer;
                    source.connect(audioContext.destination);
                    source.onended = () => {
                        avatarMouth.classList.remove('speaking');
                        updateStatus('idle', '👋', '你好！点击按钮开始对话');
                    };
                    source.start(0);
                    
                    updateStatus('playing', '🔊', '正在播放...');
                    avatarMouth.classList.add('speaking');
                }, (error) => {
                    console.error('Audio decode error:', error);
                    updateStatus('error', '⚠️', '音频播放失败');
                });
            } catch (error) {
                console.error('Play audio error:', error);
                updateStatus('error', '⚠️', '音频播放失败');
            }
        }

        async function startRecording() {
            try {
                console.log('Starting recording...');
                
                // 先检查WebSocket连接状态
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    console.error('WebSocket not connected');
                    updateStatus('error', '⚠️', 'WebSocket未连接');
                    return;
                }
                
                console.log('Requesting media stream...');
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                console.log('Media stream obtained');
                
                // 不要重新创建audioContext，使用已有的
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
                    console.log('Created audio context');
                } else if (audioContext.state === 'suspended') {
                    await audioContext.resume();
                    console.log('Resumed audio context');
                }
                
                const source = audioContext.createMediaStreamSource(mediaStream);
                const bufferSize = 4096;
                
                scriptProcessor = audioContext.createScriptProcessor(bufferSize, 1, 1);
                
                scriptProcessor.onaudioprocess = (event) => {
                    const inputData = event.inputBuffer.getChannelData(0);
                    const pcmData = new Int16Array(inputData.length);
                    
                    for (let i = 0; i < inputData.length; i++) {
                        pcmData[i] = Math.max(-1, Math.min(1, inputData[i])) * 0x7FFF;
                    }
                    
                    audioChunks.push(pcmData);
                    
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        const uint8Array = new Uint8Array(pcmData.buffer);
                        let binary = '';
                        const len = uint8Array.byteLength;
                        for (let i = 0; i < len; i++) {
                            binary += String.fromCharCode(uint8Array[i]);
                        }
                        const base64Data = btoa(binary);
                        ws.send(JSON.stringify({
                            type: 'audio_data',
                            audio_data: base64Data
                        }));
                    }
                };
                
                source.connect(scriptProcessor);
                scriptProcessor.connect(audioContext.destination);
                
                // 先更新本地UI状态
                isRecording = true;
                audioChunks = [];
                recordButton.classList.add('recording');
                buttonLabel.textContent = '点击停止录音';
                // 先显示本地录音状态
                updateStatus('recording', '🎤', '正在录音...');
                
                // 然后通知服务器
                console.log('Sending start_recording message...');
                ws.send(JSON.stringify({ type: 'start_recording' }));
                console.log('Recording started successfully');
            } catch (error) {
                console.error('Start recording error:', error);
                // 重置状态
                isRecording = false;
                recordButton.classList.remove('recording');
                buttonLabel.textContent = '点击开始录音';
                updateStatus('error', '⚠️', '无法访问麦克风');
            }
        }

        function stopRecording() {
            try {
                console.log('Stopping recording...');
                
                // 先停止媒体流
                if (mediaStream) {
                    mediaStream.getTracks().forEach(track => track.stop());
                    mediaStream = null;
                }
                
                // 断开音频处理链
                if (scriptProcessor) {
                    scriptProcessor.disconnect();
                    scriptProcessor = null;
                }
                
                // 关闭音频上下文
                if (audioContext) {
                    audioContext.close();
                    audioContext = null;
                }
                
                // 更新本地UI状态
                isRecording = false;
                recordButton.classList.remove('recording');
                buttonLabel.textContent = '点击开始录音';
                
                // 通知服务器停止录音
                if (ws && ws.readyState === WebSocket.OPEN) {
                    console.log('Sending stop_recording message...');
                    ws.send(JSON.stringify({ type: 'stop_recording' }));
                }
                
                console.log('Recording stopped successfully');
            } catch (error) {
                console.error('Stop recording error:', error);
            }
        }

        recordButton.addEventListener('click', () => {
            console.log('Record button clicked, isRecording:', isRecording);
            
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        window.addEventListener('load', () => {
            connectWebSocket();
        });
    </script>
</body>
</html>
